name: release
on:
  push:
    tags:
      - v*.*.*
      - "!v*.*.*-**"
env:
  PROVIDER: "render"
  NPM_REGISTRY_URL: https://registry.npmjs.org
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - run: source ./.github/scripts/lang-runtime-versions.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      # Use a commit hash from https://github.com/golangci/golangci-lint/commits/main.
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@5e7d0c42ef205fc7a738753a8126511290b42d66
          make lint

      - name: Test
        run: make test

  publish-binary:
    name: Publish binary
    runs-on: ${{ matrix.agent-os }}
    needs: lint
    permissions:
      # To allow goreleaser to create/edit GH releases.
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - run: source ./.github/scripts/lang-runtime-versions.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Install Pulumi CLI
        uses: pulumi/actions@598b17045ce608f3af1f68e06c04649a0ab4a829
        with:
          pulumi-version: latest

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: pulumi/pulumictl
          tag: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@01cbe076be10ba0af7b0b9319ac490a93d3d2fcd
        with:
          args: -f ${{ matrix.goreleaser }} -p 1 release --clean --timeout 90m0s
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        agent-os:
          - ubuntu-latest
          - macos-latest
        include:
          - agent-os: ubuntu-latest
            goreleaser: .goreleaser.yml
          - agent-os: macos-latest
            goreleaser: .goreleaser.darwin.yml

  publish-sdk:
    name: Publish SDKs
    runs-on: ubuntu-latest
    needs: publish-binary
    permissions:
      contents: read
      # Needed for OIDC token exchange with language registries
      # for Trusted Publishing.
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - run: source ./.github/scripts/lang-runtime-versions.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: pulumi/pulumictl
          tag: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@598b17045ce608f3af1f68e06c04649a0ab4a829
        with:
          pulumi-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate SDK
        run: make gen ${{ matrix.language }}_sdk
        env:
          # The setup-node action creates an .npmrc file
          # referencing `NODE_AUTH_TOKEN`.
          # https://docs.github.com/en/actions/tutorials/publish-packages/publish-nodejs-packages
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

      - name: Check worktree clean
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet; then
              >&2 echo "error: working tree is not clean, aborting!"
              git status
              git diff
              exit 1
          fi

      - name: Compress SDK folder (except Go)
        if: ${{ matrix.language != 'go' }}
        run: tar -zcf sdk/${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }}/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.language  }}-sdk.tar.gz
          path: ${{ github.workspace}}/sdk/${{ matrix.language }}.tar.gz

      # Publish to PyPI using trusted publishing.
      # https://docs.pypi.org/trusted-publishers/using-a-publisher/
      - if: ${{ matrix.language == 'python' }}
        name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@c0d6f8e4af2ad8247a7da213b199ea78dac8395e
        with:
          packages_dir: ${{github.workspace}}/sdk/python/bin/dist

      # The npm package will be staged.
      # A maintainer with access to the npm account
      # will need to approve it have it published.
      - if: ${{ matrix.language == 'nodejs' }}
        run: npm stage publish --access public --provenance
        working-directory: ${{github.workspace}}/sdk/nodejs/bin
        env:
          # The setup-node action creates an .npmrc file
          # referencing `NODE_AUTH_TOKEN`.
          # https://docs.github.com/en/actions/tutorials/publish-packages/publish-nodejs-packages
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1.2.0
        if: ${{ matrix.language == 'dotnet' }}
        id: login
        with:
          user: ${{ secrets.NUGET_PUBLISHER_USER }}

      - if: ${{ matrix.language == 'dotnet' }}
        name: publish nuget package
        run: |
          dotnet nuget push ${{github.workspace}}/sdk/dotnet/bin/Debug/*.nupkg -s ${{ env.NUGET_FEED_URL }} --api-key ${{steps.login.outputs.NUGET_API_KEY}}
          echo "done publishing packages"
    strategy:
      fail-fast: true
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go

  publish-release:
    runs-on: ubuntu-latest
    needs: publish-binary
    permissions:
      # To allow GH CLI to edit the GH release.
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Publish GH release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

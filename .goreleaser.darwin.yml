version: 2

archives:
  - id: archive
    name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
builds:
  - binary: pulumi-resource-render
    main: ./cmd/pulumi-resource-render/
    dir: provider
    env:
      - GO111MODULE=on
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
    ldflags:
      # The line below MUST align with the module in current provider/go.mod
      - -X github.com/cloudy-sky-software/pulumi-render/provider/pkg/version.Version={{.Tag }}
checksum:
  name_template: "{{ .ProjectName }}_darwin_checksums.txt"
changelog:
  disable: true
release:
  disable: false
  # If set to true, will not auto-publish the release.
  # Note: all GitHub releases start as drafts while artifacts are uploaded.
  # Available only for GitHub and Gitea.
  draft: true

  # Whether to remove existing draft releases with the same name before creating
  # a new one.
  #
  # Only effective if `draft` is set to true.
  # Available only for GitHub.
  replace_existing_draft: false

  # Whether to use an existing draft release as the target release.
  use_existing_draft: true
  prerelease: auto
  header: |
    See [CHANGELOG.md](https://github.com/cloudy-sky-software/pulumi-render/blob/main/CHANGELOG.md)
snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"
